/* Der Start-Button */
.startbutton {

/* Die Pfeile (Animation) */
.pfeil {
  font-size: 2rem;
  color: #2c3e50;
  display: inline-block;
  animation: bounce 1s infinite;
}

/* Linker Pfeil bewegt sich nach rechts */
.pfeil:first-child {
  animation-name: slideRight;
}

/* Rechter Pfeil bewegt sich nach links */
.pfeil:last-child {
  animation-name: slideLeft;
}

/* Animationen */
@keyframes slideRight {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(10px); }
}

@keyframes slideLeft {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(-10px); }
}
